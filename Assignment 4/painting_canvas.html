<!-->Painting board with canvas<!-->
<!DOCTYPE html>
<html>
<head>
  <title>Simple Paint App</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    canvas {
      border: 2px solid #333;
      background-color: white;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <h2>Simple Paint Board</h2>
  <!-- Paint karne ke liye canvas area -->
  <canvas id="paintCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    let isDrawing = false;

    // Jab mouse ka button dabayein (click karke rakhein)
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY); // Line yahan se shuru hogi
    });

    // Jab mouse ko drag karein (ghumaayein)
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return; // Agar click nahi kiya hai toh kuch mat karo
      ctx.lineTo(e.offsetX, e.offsetY); // Cursor ki nayi position tak line kheecho
      ctx.strokeStyle = 'coral'; // Paint ka color
      ctx.lineWidth = 5; // Paint ki motai (thickness)
      ctx.lineCap = 'round'; // Brush ka kona gol rahega
      ctx.stroke(); // Draw kar do
    });

    // Jab mouse ka button chhod dein
    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
    });

    // Jab mouse canvas se bahar chala jaye
    canvas.addEventListener('mouseleave', () => {
      isDrawing = false;
    });
  </script>

</body>
</html>
